name: Node CI

on: [push, pull_request]

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Turn off autocrlf for Windows testing
      run: |
        git config --global core.autocrlf false
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - name: npm install, build, and test
      run: |
        npm ci
        npm run build --if-present
        npm test
      env:
        CI: true

  eslint-9:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
    - name: npm install, and test rules with ESLint 9
      # TODO: Run all tests with ESLint 9, once the integration tests and this
      # repo's lint config use flat config (requires eslint-config-wikimedia)
      run: |
        npm ci
        npm install --no-save --legacy-peer-deps eslint@9
        npx mocha --reporter dot tests/ tests/rules/
      env:
        CI: true
